[package]
name = "b27-primitives"
version = "0.6.0-beta.1"
edition = "2021"
[lib]
crate-type = ["cdylib","rlib"]
[dependencies]
sha2 = "0.10"
unicode-normalization = "0.1"
regex = "1"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
