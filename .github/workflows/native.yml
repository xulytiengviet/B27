name: B27 native research gates
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  codec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node test-native.cjs
  rust-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo test --manifest-path native-rust/Cargo.toml
      - run: cargo build --release --target wasm32-unknown-unknown --manifest-path native-rust/Cargo.toml
  vhdl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ghdl
      - run: ghdl -a --std=08 fpga/base27.vhd fpga/tb_base27.vhd && ghdl -e --std=08 tb_base27 && ghdl -r --std=08 tb_base27 --assert-level=error
